<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eve — TW Command Tracker</title>
<style>
  :root { --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; --border: #30363d; --accent: #58a6ff; --yes: #3fb950; --no: #f85149; --decide: #d29922; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .filters { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { background: var(--border); color: var(--fg); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .filters button.active { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #161b22; position: sticky; top: 0; }
  tr:hover td { background: #161b22; }
  .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; font-weight: 600; }
  .yes { color: var(--yes); font-weight: 600; }
  .no { color: var(--no); }
  .decide { color: var(--decide); font-weight: 600; }
  .pending { color: var(--muted); font-style: italic; }
  .notes { color: var(--muted); font-size: 0.75rem; }
  .count { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }
  .ro { color: #8b949e; font-size: 0.7rem; }
</style>
</head>
<body>
<h1>TW Command Tracker</h1>
<p class="sub">BMC Helix Discovery 26.2 on-prem &middot; Appliance Pattern Access &middot; last updated <span id="ts"></span></p>
<div class="filters">
  <button class="active" onclick="filterRows('all')">All</button>
  <button onclick="filterRows('decide')">Decide</button>
  <button onclick="filterRows('yes')">Useful</button>
  <button onclick="filterRows('no')">Ignore</button>
  <button onclick="filterRows('pending')">Not reviewed</button>
</div>
<table>
  <thead>
    <tr><th>#</th><th>Command</th><th>What it does</th><th>Read-only</th><th>Useful for Helm</th><th>In pattern</th><th>Notes</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<p class="count" id="count"></p>
<script>
const data = [
["tw_adduser","Creates a new Tideway user account on the appliance","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_app_import","Imports application models/definitions into the datastore","no","","","Covered by /models endpoints"],
["tw_apply_filters","Applies saved filters to the data model","decide","","",""],
["tw_appserver","Controls the application server process (Tideway service)","no","","","Internal process control; no API equivalent"],
["tw_backup","Creates a backup of the appliance datastore and configuration","yes","","","No backup/restore API in v1.18"],
["tw_baseline","Manages baseline configurations for comparison","no","","","Covered by /admin/baseline"],
["tw_cam_import","Imports CAM (Collaborative Application Mapping) data","decide","","",""],
["tw_check_cores","Checks CPU core usage and licensing against cores","decide","","",""],
["tw_check_reports_model","Validates the reporting data model for consistency","no","","","Covered by /admin/builtin_reports and /admin/custom_reports"],
["tw_checkuser","Verifies a user account exists and its properties","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_cluster_control","Manages cluster membership and node roles","no","","","Covered by /admin/cluster"],
["tw_commission","Handles commissioning/decommissioning of devices in the model","decide","","",""],
["tw_compress_logs","Compresses log files to save disk space","no","","","OS-level maintenance; no API equivalent"],
["tw_config_dashboards","Manages dashboard configurations","decide","","",""],
["tw_config_dump","Dumps the appliance configuration for inspection or backup","yes","","","No config-dump endpoint in v1.18"],
["tw_consolidation_control","Controls consolidation of discovery data across sources","no","","","Covered by /admin/consolidation"],
["tw_cron_update","Updates scheduled cron jobs on the appliance","no","","","No cron API in v1.18"],
["tw_cyberark","Integrates with CyberArk vault for credential management","decide","","","New in newer versions; no dedicated API found"],
["tw_data_import","Imports data into the datastore from external sources","no","","","Covered by /data/import"],
["tw_deluser","Deletes a Tideway user account","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_deployment","Manages deployment packages and their application","decide","","",""],
["tw_device_capture","Captures device configuration snapshots","decide","","",""],
["tw_disco_control","Core discovery control — start, stop, pause, resume scans","no","","","Covered by /discovery status and /discovery/runs"],
["tw_disco_export_platforms","Exports platform definitions used by discovery","decide","","",""],
["tw_disco_import_platforms","Imports platform definitions into discovery","decide","","",""],
["tw_disk_utils","Disk maintenance utilities — check, repair, compact","no","","","OS-level maintenance; no API equivalent"],
["tw_dr_control","Disaster recovery control — promote, demote, sync","decide","","","No DR API found in v1.18"],
["tw_dr_discovery","DR-specific discovery operations","decide","","",""],
["tw_ds_compact","Compacts the datastore to reclaim space","no","","","Datastore maintenance; no API equivalent"],
["tw_ds_generation_control","Controls datastore generation numbering","no","","","Datastore maintenance; no API equivalent"],
["tw_ds_progress","Reports datastore operation progress","yes","","","No direct API equivalent"],
["tw_event_control","Manages the event system — post, list, clear events","no","","","Covered by /events"],
["tw_excluderanges","Manages IP address exclusion ranges for scanning","no","","","Covered by discovery exclude endpoints"],
["tw_fips_control","Controls FIPS compliance mode","no","","","OS/security config; no API equivalent"],
["tw_fix_interrupted_disk_utils","Repairs disk utilities interrupted mid-run","no","","","OS-level maintenance; no API equivalent"],
["tw_generic_watchdog","Generic watchdog for monitoring appliance health","no","","","Internal monitoring; no API equivalent"],
["tw_https_generatekey","Generates HTTPS key material","no","","","TLS setup; no API equivalent"],
["tw_https_selfsign","Creates a self-signed HTTPS certificate","no","","","TLS setup; no API equivalent"],
["tw_imp_csv","Imports CSV data into the model","no","","","Covered by /data/import"],
["tw_injectip","Injects an IP address into the discovery queue","decide","","",""],
["tw_license_report","Generates a license usage report","no","","","Covered by /admin/licensing"],
["tw_list_searches","Lists saved searches on the appliance","no","","","Covered by /admin/builtin_reports and /admin/custom_reports"],
["tw_listusers","Lists all Tideway user accounts","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_log_performance","Logs performance metrics for diagnostics","decide","","",""],
["tw_model_wipe","Wipes the data model — destructive","no","","","Dangerous; also no API equivalent"],
["tw_ol9_stig","Applies Oracle Linux 9 STIG hardening profile","no","","","OS hardening; no API equivalent"],
["tw_options","Views or sets appliance configuration options","decide","","","Partial overlap with /admin/preferences"],
["tw_passwd","Changes a user password","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_pattern_management","Manages TKU pattern packages — install, list, remove","no","","","Covered by /knowledge"],
["tw_purge_winproxy_logs","Purges Windows proxy log files","no","","","Covered by proxy pool endpoints"],
["tw_purge_winproxy_recorddata","Purges Windows proxy recorded data","no","","","Covered by proxy pool endpoints"],
["tw_query","Runs queries against the datastore and returns results","no","","","Covered by /data/search"],
["tw_reasoningstatus","Reports the status of the reasoning engine","decide","","",""],
["tw_recover_winproxy_config","Recovers Windows proxy configuration","no","","","Covered by proxy pool endpoints"],
["tw_recover_winproxy_logs","Recovers Windows proxy logs","no","","","Covered by proxy pool endpoints"],
["tw_recover_winproxy_recorddata","Recovers Windows proxy record data","no","","","Covered by proxy pool endpoints"],
["tw_report_usage","Reports appliance resource usage","decide","","",""],
["tw_restore","Restores from a backup","no","","","No backup/restore API in v1.18"],
["tw_restricted_winproxy_ctrl","Restricted control of the Windows proxy","no","","","Covered by proxy pool endpoints"],
["tw_root_node_key_export","Exports the root node encryption key","decide","","","Security-sensitive; no API equivalent"],
["tw_root_node_key_import","Imports a root node encryption key","decide","","","Security-sensitive; no API equivalent"],
["tw_run_upgrade","Runs the appliance upgrade process","no","","","Covered by /admin/upgrade"],
["tw_save_ssl_key_password","Saves the SSL key password","no","","","TLS setup; no API equivalent"],
["tw_scan_control","Controls individual scan ranges and their state","no","","","Covered by /discovery/runs"],
["tw_secopts","Manages security options and settings","decide","","",""],
["tw_service_control","Controls system services on the appliance","no","","","Internal service control; no API equivalent"],
["tw_sign_winproxy_config","Signs Windows proxy configuration","no","","","Covered by proxy pool endpoints"],
["tw_startup_control","Controls appliance startup behavior","no","","","No API equivalent"],
["tw_status_display","Displays overall appliance status","no","","","Partial overlap with /admin/about and /discovery"],
["tw_support_tool","Runs the support/diagnostic tool bundle","decide","","",""],
["tw_supportability","Gathers supportability data for BMC","decide","","",""],
["tw_svc_cluster_manager","Service wrapper for cluster manager","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_cmdbsync_transformer","Service wrapper for CMDB sync transformer","decide","","","Internal service wrapper"],
["tw_svc_discovery","Service wrapper for discovery engine","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_eca_engine","Service wrapper for ECA engine","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_external_api","Service wrapper for external API","decide","","","Internal service wrapper"],
["tw_svc_inferred_sync","Service wrapper for inferred sync","decide","","","Internal service wrapper"],
["tw_svc_model","Service wrapper for model service","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_privileged","Service wrapper for privileged operations","decide","","","Internal service wrapper"],
["tw_svc_reasoning","Service wrapper for reasoning engine","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_reports","Service wrapper for reporting service","decide","","","Internal service wrapper"],
["tw_svc_security","Service wrapper for security service","no","","","Internal service wrapper; no API equivalent"],
["tw_svc_vault","Service wrapper for vault service","no","","","Covered by /vault endpoints"],
["tw_sync_control","Controls synchronization operations","no","","","Partial overlap with /admin/consolidation"],
["tw_tax_export","Exports taxonomy files from the appliance","no","","","Covered by /taxonomy"],
["tw_tax_import","Imports taxonomy files into the appliance","no","","","Covered by /taxonomy"],
["tw_terminate_winproxy","Terminates the Windows proxy process","no","","","Covered by proxy pool endpoints"],
["tw_tripwire_rebaseline","Rebaselines Tripwire integrity monitoring","decide","","",""],
["tw_upduser","Updates an existing Tideway user account","no","","","No user-management endpoints in the v1.18 REST API"],
["tw_upgrade","Runs the product upgrade","no","","","Covered by /admin/upgrade"],
["tw_upload_winproxy_config","Uploads Windows proxy configuration","no","","","Covered by proxy pool endpoints"],
["tw_vault_control","Controls the credential vault","no","","","Covered by /vault endpoints"],
["tw_vault_export","Exports vault contents","no","","","Covered by /vault endpoints"],
["tw_vault_import","Imports vault contents","no","","","Covered by /vault endpoints"],
["tw_winproxy_disk_usage","Reports Windows proxy disk usage","no","","","Covered by proxy pool endpoints"],
["tw_winproxy_settings","Views or sets Windows proxy settings","no","","","Covered by proxy pool endpoints"]
];
const tbody = document.getElementById('rows);
data.forEach((r, i) => {
  const tr = document.createElement('tr);
  const useful = r[4] === 'yes' ? 'yes' : r[4] === 'no' ? 'no' : r[4] === 'decide' ? 'decide' : 'pending';
  const ro = r[3] === 'yes' ? '<span class="ro">R</span>' : (r[3] === 'no' ? '<span class="ro">W</span>' : '—);
  tr.innerHTML = '<td>' + (i+1) + '</td><td class="cmd">' + r[0] + '</td><td>' + r[1] + '</td><td>' + ro + '</td><td class="' + useful + '">' + (r[4] || '—') + '</td><td class="pending">' + (r[5] || '—') + '</td><td class="notes">' + (r[6] || '') + '</td>';
  tbody.appendChild(tr);
});
document.getElementById('ts').textContent = new Date().toISOString().slice(0,16).replace('T',' ');
document.getElementById('count').textContent = data.length + ' commands tracked · R = read-only, W = writes state';
function filterRows(f) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active);
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    const u = data[i][4];
    tr.style.display = (f==='all' || u===f) ? '' : 'none';
  });
}
</script>
</body>
</html>
