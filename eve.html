<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eve — TW Command Tracker</title>
<style>
  :root { --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; --border: #30363d; --accent: #58a6ff; --yes: #3fb950; --no: #f85149; --decide: #d29922; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); padding: 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .filters { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button { background: var(--border); color: var(--fg); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
  .filters button.active { background: var(--accent); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #161b22; position: sticky; top: 0; }
  tr:hover td { background: #161b22; }
  .cmd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; font-weight: 600; }
  .yes { color: var(--yes); font-weight: 600; }
  .no { color: var(--no); }
  .decide { color: var(--decide); font-weight: 600; }
  .pending { color: var(--muted); font-style: italic; }
  .notes { color: var(--muted); font-size: 0.75rem; }
  .count { color: var(--muted); font-size: 0.8rem; margin-top: 12px; }
</style>
</head>
<body>
<h1>TW Command Tracker</h1>
<p class="sub">BMC Helix Discovery 26.2 on-prem &middot; Appliance Pattern Access &middot; last updated <span id="ts"></span></p>
<div class="filters">
  <button class="active" onclick="filterRows('all')">All</button>
  <button onclick="filterRows('decide')">Decide</button>
  <button onclick="filterRows('yes')">Useful</button>
  <button onclick="filterRows('no')">Ignore</button>
  <button onclick="filterRows('pending')">Not reviewed</button>
</div>
<table>
  <thead>
    <tr><th>#</th><th>Command</th><th>What it does</th><th>Useful for Helm</th><th>In pattern</th><th>Notes</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<p class="count" id="count"></p>
<script>
const data = [
["tw_adduser","Creates a new Tideway user account on the appliance","decide","",""],
["tw_app_import","Imports application models/definitions into the datastore","decide","",""],
["tw_apply_filters","Applies saved filters to the data model","decide","",""],
["tw_appserver","Controls the application server process (Tideway service)","decide","",""],
["tw_backup","Creates a backup of the appliance datastore and configuration","yes","","Core for DR and recovery"],
["tw_baseline","Manages baseline configurations for comparison","decide","",""],
["tw_cam_import","Imports CAM (Collaborative Application Mapping) data","decide","",""],
["tw_check_cores","Checks CPU core usage and licensing against cores","decide","",""],
["tw_check_reports_model","Validates the reporting data model for consistency","decide","",""],
["tw_checkuser","Verifies a user account exists and its properties","decide","",""],
["tw_cluster_control","Manages cluster membership and node roles","yes","","Essential for clustered appliances"],
["tw_commission","Handles commissioning/decommissioning of devices in the model","decide","",""],
["tw_compress_logs","Compresses log files to save disk space","decide","",""],
["tw_config_dashboards","Manages dashboard configurations","decide","",""],
["tw_config_dump","Dumps the appliance configuration for inspection or backup","yes","","Useful for auditing config state"],
["tw_consolidation_control","Controls consolidation of discovery data across sources","decide","",""],
["tw_cron_update","Updates scheduled cron jobs on the appliance","decide","",""],
["tw_cyberark","Integrates with CyberArk vault for credential management","decide","","New in newer versions"],
["tw_data_import","Imports data into the datastore from external sources","decide","",""],
["tw_deluser","Deletes a Tideway user account","decide","",""],
["tw_deployment","Manages deployment packages and their application","decide","",""],
["tw_device_capture","Captures device configuration snapshots","decide","",""],
["tw_disco_control","Core discovery control — start, stop, pause, resume scans","yes","","Central to discovery operations"],
["tw_disco_export_platforms","Exports platform definitions used by discovery","decide","",""],
["tw_disco_import_platforms","Imports platform definitions into discovery","decide","",""],
["tw_disk_utils","Disk maintenance utilities — check, repair, compact","decide","",""],
["tw_dr_control","Disaster recovery control — promote, demote, sync","yes","","Key for DR setups"],
["tw_dr_discovery","DR-specific discovery operations","decide","",""],
["tw_ds_compact","Compacts the datastore to reclaim space","decide","",""],
["tw_ds_generation_control","Controls datastore generation numbering","decide","",""],
["tw_ds_progress","Reports datastore operation progress","decide","",""],
["tw_event_control","Manages the event system — post, list, clear events","yes","","Directly relevant to /events API trigger"],
["tw_excluderanges","Manages IP address exclusion ranges for scanning","decide","",""],
["tw_fips_control","Controls FIPS compliance mode","decide","",""],
["tw_fix_interrupted_disk_utils","Repairs disk utilities interrupted mid-run","decide","",""],
["tw_generic_watchdog","Generic watchdog for monitoring appliance health","decide","",""],
["tw_https_generatekey","Generates HTTPS key material","decide","",""],
["tw_https_selfsign","Creates a self-signed HTTPS certificate","decide","",""],
["tw_imp_csv","Imports CSV data into the model","decide","",""],
["tw_injectip","Injects an IP address into the discovery queue","decide","",""],
["tw_license_report","Generates a license usage report","decide","",""],
["tw_list_searches","Lists saved searches on the appliance","decide","",""],
["tw_listusers","Lists all Tideway user accounts","decide","",""],
["tw_log_performance","Logs performance metrics for diagnostics","decide","",""],
["tw_model_wipe","Wipes the data model — destructive","no","","Dangerous, ignore for Helm"],
["tw_ol9_stig","Applies Oracle Linux 9 STIG hardening profile","decide","","New for OL9 appliances"],
["tw_options","Views or sets appliance configuration options","yes","","General config access"],
["tw_passwd","Changes a user password","decide","",""],
["tw_pattern_management","Manages TKU pattern packages — install, list, remove","yes","","Central to pattern deployment"],
["tw_purge_winproxy_logs","Purges Windows proxy log files","decide","","Winproxy maintenance"],
["tw_purge_winproxy_recorddata","Purges Windows proxy recorded data","decide","","Winproxy maintenance"],
["tw_query","Runs queries against the datastore and returns results","yes","","Primary read path for Helm"],
["tw_reasoningstatus","Reports the status of the reasoning engine","decide","",""],
["tw_recover_winproxy_config","Recovers Windows proxy configuration","decide","","Winproxy maintenance"],
["tw_recover_winproxy_logs","Recovers Windows proxy logs","decide","","Winproxy maintenance"],
["tw_recover_winproxy_recorddata","Recovers Windows proxy record data","decide","","Winproxy maintenance"],
["tw_report_usage","Reports appliance resource usage","decide","",""],
["tw_restore","Restores from a backup","yes","","Pairs with tw_backup"],
["tw_restricted_winproxy_ctrl","Restricted control of the Windows proxy","decide","","Winproxy maintenance"],
["tw_root_node_key_export","Exports the root node encryption key","decide","","Security-sensitive"],
["tw_root_node_key_import","Imports a root node encryption key","decide","","Security-sensitive"],
["tw_run_upgrade","Runs the appliance upgrade process","decide","",""],
["tw_save_ssl_key_password","Saves the SSL key password","decide","",""],
["tw_scan_control","Controls individual scan ranges and their state","yes","","Granular scan management"],
["tw_secopts","Manages security options and settings","decide","",""],
["tw_service_control","Controls system services on the appliance","decide","",""],
["tw_sign_winproxy_config","Signs Windows proxy configuration","decide","","Winproxy maintenance"],
["tw_startup_control","Controls appliance startup behavior","decide","",""],
["tw_status_display","Displays overall appliance status","yes","","Quick health check"],
["tw_support_tool","Runs the support/diagnostic tool bundle","decide","",""],
["tw_supportability","Gathers supportability data for BMC","decide","",""],
["tw_svc_cluster_manager","Service wrapper for cluster manager","no","","Internal service, ignore"],
["tw_svc_cmdbsync_transformer","Service wrapper for CMDB sync transformer","decide","","Internal service"],
["tw_svc_discovery","Service wrapper for discovery engine","no","","Internal service, ignore"],
["tw_svc_eca_engine","Service wrapper for ECA engine","no","","Internal service, ignore"],
["tw_svc_external_api","Service wrapper for external API","decide","","Internal service"],
["tw_svc_inferred_sync","Service wrapper for inferred sync","decide","","Internal service"],
["tw_svc_model","Service wrapper for model service","no","","Internal service, ignore"],
["tw_svc_privileged","Service wrapper for privileged operations","decide","","Internal service"],
["tw_svc_reasoning","Service wrapper for reasoning engine","no","","Internal service, ignore"],
["tw_svc_reports","Service wrapper for reporting service","decide","","Internal service"],
["tw_svc_security","Service wrapper for security service","no","","Internal service, ignore"],
["tw_svc_vault","Service wrapper for vault service","decide","","Internal service"],
["tw_sync_control","Controls synchronization operations","decide","",""],
["tw_tax_export","Exports taxonomy files from the appliance","yes","","Directly relevant to custom taxonomy"],
["tw_tax_import","Imports taxonomy files into the appliance","yes","","Directly relevant to custom taxonomy"],
["tw_terminate_winproxy","Terminates the Windows proxy process","decide","","Winproxy maintenance"],
["tw_tripwire_rebaseline","Rebaselines Tripwire integrity monitoring","decide","",""],
["tw_upduser","Updates an existing Tideway user account","decide","",""],
["tw_upgrade","Runs the product upgrade","decide","",""],
["tw_upload_winproxy_config","Uploads Windows proxy configuration","decide","","Winproxy maintenance"],
["tw_vault_control","Controls the credential vault","decide","",""],
["tw_vault_export","Exports vault contents","decide","","Security-sensitive"],
["tw_vault_import","Imports vault contents","decide","","Security-sensitive"],
["tw_winproxy_disk_usage","Reports Windows proxy disk usage","decide","","Winproxy maintenance"],
["tw_winproxy_settings","Views or sets Windows proxy settings","decide","","Winproxy maintenance"]
];
const tbody = document.getElementById('rows');
data.forEach((r, i) => {
  const tr = document.createElement('tr'');
  const useful = r[3] === 'yes' ? 'yes' : r[3] === 'no' ? 'no' : r[3] === 'decide' ? 'decide' : 'pending';
  tr.innerHTML = `<td>${i+1}</td><td class="cmd">${r[0]}</td><td>${r[1]}</td><td class="${useful}">${r[3] || '—'}</td><td class="pending">${r[4] || '—'}</td><td class="notes">${r[5] || ''}</td>`;
  tbody.appendChild(tr);
});
document.getElementById('ts').textContent = new Date().toISOString().slice(0,16).replace('T',' ');
document.getElementById('count').textContent = data.length + ' commands tracked';
function filterRows(f) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active);
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    const u = data[i][3];
    tr.style.display = (f==='all' || u===f) ? '' : 'none';
  });
}
</script>
</body>
</html>
