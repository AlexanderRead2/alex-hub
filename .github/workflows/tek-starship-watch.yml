name: Tek Starship launch watcher

# Poll Launch Library 2 for Starship launches. State lives on the
# watch-state branch (tek-starship.json) so pushes do not redeploy the
# public GitHub Pages site.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: tek-starship-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load previous state
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/state"
          if git ls-remote --exit-code --heads origin watch-state >/dev/null; then
            git fetch --no-tags --depth 1 origin watch-state
            if git cat-file -e origin/watch-state:tek-starship.json 2>/dev/null; then
              git show origin/watch-state:tek-starship.json > "${RUNNER_TEMP}/state/tek-starship.json"
              echo "Loaded previous state from the watch-state branch."
            else
              echo "{}" > "${RUNNER_TEMP}/state/tek-starship.json"
              echo "watch-state branch has no tek-starship.json; starting a baseline."
            fi
          else
            echo "{}" > "${RUNNER_TEMP}/state/tek-starship.json"
            echo "No watch-state branch yet; this run will record a baseline only."
          fi

      - name: Compare Starship launches
        env:
          WEBHOOK_URL: https://api2.cursor.sh/automations/webhook/2931fd8a-9f39-593f-a831-94b072a730cf
          TEK_LAUNCH_WEBHOOK_SECRET: ${{ secrets.TEK_LAUNCH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tek_starship_watch.py \
            --prev "${RUNNER_TEMP}/state/tek-starship.json" \
            --out "${RUNNER_TEMP}/state/tek-starship-new.json" \
            --changed-flag "${RUNNER_TEMP}/state/commit-state"

      - name: Save state
        if: success()
        run: |
          set -euo pipefail
          if [ ! -f "${RUNNER_TEMP}/state/commit-state" ]; then
            echo "No state update needed."
            exit 0
          fi
          if [ ! -f "${RUNNER_TEMP}/state/tek-starship-new.json" ]; then
            echo "New state file is missing."
            exit 1
          fi

          # Add only tek-starship.json to the existing watch-state branch.
          # Never push to main, and do not modify other files on the branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          reason="Update Starship watch state"
          if [ "$(cat "${RUNNER_TEMP}/state/commit-state")" = "baseline" ]; then
            reason="Record Starship watch baseline"
          fi

          TREE_DIR="${RUNNER_TEMP}/state-tree"
          INDEX_FILE="${RUNNER_TEMP}/state.index"

          write_state_commit() {
            local parent="${1:-}"
            rm -rf "${TREE_DIR}" "${INDEX_FILE}"
            mkdir -p "${TREE_DIR}"
            export GIT_WORK_TREE="${TREE_DIR}"
            export GIT_INDEX_FILE="${INDEX_FILE}"
            if [ -n "${parent}" ]; then
              git read-tree "${parent}"
              git checkout-index -a -f
            fi
            cp "${RUNNER_TEMP}/state/tek-starship-new.json" "${TREE_DIR}/tek-starship.json"
            git add tek-starship.json
            local tree
            tree="$(git write-tree)"
            unset GIT_WORK_TREE GIT_INDEX_FILE
            if [ -n "${parent}" ]; then
              git commit-tree "${tree}" -p "${parent}" -m "${reason}"
            else
              git commit-tree "${tree}" -m "${reason}"
            fi
          }

          if git ls-remote --exit-code --heads origin watch-state >/dev/null; then
            git fetch --no-tags --depth 1 origin watch-state:refs/remotes/origin/watch-state
            COMMIT="$(write_state_commit origin/watch-state)"
          else
            COMMIT="$(write_state_commit)"
          fi
          if ! git push origin "${COMMIT}:refs/heads/watch-state"; then
            git fetch --no-tags --depth 1 origin watch-state:refs/remotes/origin/watch-state
            COMMIT="$(write_state_commit origin/watch-state)"
            git push origin "${COMMIT}:refs/heads/watch-state"
          fi
